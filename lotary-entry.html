<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lottery Entry - Admin Panel</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        min-height: 100vh;
        font-family: "Segoe UI", sans-serif;
      }

      /* Top Navbar (new theme) */
      .topbar {
        background: linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      }

      .brand-wrap h3 {
        margin: 0;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #fff;
        line-height: 1.1;
      }
      .brand-wrap p {
        margin: 0;
        font-size: 0.8rem;
        opacity: 0.8;
        color: #fff;
      }

      .navbar .nav-link {
        color: rgba(255, 255, 255, 0.85);
        padding: 10px 14px;
        border-radius: 12px;
        font-weight: 600;
        transition: all 0.25s ease;
        display: inline-flex;
        gap: 10px;
        align-items: center;
        white-space: nowrap;
      }
      .navbar .nav-link:hover,
      .navbar .nav-link.active {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      }
      .navbar .nav-link i {
        font-size: 1.15rem;
      }
      @media (max-width: 991.98px) {
        .navbar .nav-link {
          width: 100%;
          justify-content: flex-start;
          padding: 12px 14px;
        }
      }

      /* Main spacing */
      .main-content {
        padding: 40px 16px;
      }
      @media (min-width: 992px) {
        .main-content {
          padding: 40px;
        }
      }

      /* Page header */
      .page-head {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 22px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
        backdrop-filter: blur(8px);
      }
      .header-title {
        font-weight: 800;
        color: #0f172a;
        letter-spacing: -0.4px;
      }
      .small-muted {
        color: #64748b;
        font-size: 0.92rem;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
      }

      /* Cards */
      .soft-card {
        background: #fff;
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 22px;
        box-shadow: 0 14px 40px rgba(2, 6, 23, 0.08);
      }
      .lot-card {
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .lot-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 50px rgba(99, 102, 241, 0.18);
      }

      /* Premium button */
      .btn {
        border-radius: 14px;
      }
      .primary-grad {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border: none;
        color: #fff;
        font-weight: 700;
        padding: 0.85rem 1.1rem;
      }
      .primary-grad:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 28px rgba(99, 102, 241, 0.35);
      }
      .btn-soft {
        border: 1px solid rgba(148, 163, 184, 0.55);
        background: rgba(255, 255, 255, 0.85);
        padding: 0.85rem 1.1rem;
        font-weight: 700;
      }

      /* Modal style */
      .modal-content {
        border-radius: 22px !important;
        border: 1px solid rgba(148, 163, 184, 0.35);
        box-shadow: 0 18px 60px rgba(2, 6, 23, 0.22);
      }
      .modal-header {
        border-bottom: 1px solid rgba(148, 163, 184, 0.25);
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.08),
          rgba(139, 92, 246, 0.06)
        );
      }

      /* Inputs */
      .form-control,
      .form-select {
        border-radius: 14px;
        padding: 0.9rem 0.95rem;
        border: 1px solid rgba(148, 163, 184, 0.55);
        box-shadow: none !important;
      }
      .form-control:focus,
      .form-select:focus {
        border-color: rgba(99, 102, 241, 0.9);
        box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.18) !important;
      }

      @media (max-width: 575.98px) {
        .main-content {
          padding: 22px 12px;
        }
        .primary-grad,
        .btn-soft {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg topbar sticky-top">
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand d-flex align-items-center gap-3" href="#">
          <div class="brand-wrap">
            <h3>Admin Panel</h3>
            <p>Management System</p>
          </div>
        </a>

        <button
          class="navbar-toggler border-0 text-white"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#topNav"
          aria-controls="topNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="bi bi-list fs-2"></i>
        </button>

        <div class="collapse navbar-collapse" id="topNav">
          <ul class="navbar-nav ms-auto gap-lg-2" id="topbarNav">
            <li class="nav-item">
              <a class="nav-link" href="usersTraking.html">
                <i class="bi bi-people"></i> User Tracking
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="lotary-entry.html">
                <i class="bi bi-ticket-perforated"></i> Lottery Entry
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="lotary-drow.html">
                <i class="bi bi-shuffle"></i> Lottery Draw
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="product-entry.html">
                <i class="bi bi-box-seam"></i> Product Entry
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="product-buy.html">
                <i class="bi bi-cart"></i> Product Buy
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="invest-package-entry.html">
                <i class="bi bi-wallet2"></i> Invest Package Entry
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <div class="container-fluid">
        <!-- Page header -->
        <div class="page-head p-4 mb-4">
          <div
            class="d-flex flex-wrap align-items-center justify-content-between gap-3"
          >
            <div>
              <div class="header-title fs-3 mb-1">Lottery Entry</div>
              <div class="small-muted">Manage available lotteries</div>
            </div>

            <div class="d-flex flex-wrap gap-2">
              <button class="btn primary-grad" id="btnAddNew">
                <i class="bi bi-plus-lg me-2"></i>Add New Lottery
              </button>
            </div>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-3">
          <div class="fw-bold text-dark">Available Lotteries</div>
          <span
            class="badge bg-primary-subtle text-primary border border-primary-subtle"
            id="lotCount"
            >0</span
          >
        </div>

        <div class="row g-3" id="lotteryGrid">
          <!-- cards by jQuery -->
        </div>
      </div>
    </main>

    <!-- Add Modal -->
    <div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Add New Lottery</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label class="form-label fw-semibold">Lottery Name</label>
                <input
                  class="form-control"
                  id="addName"
                  placeholder="e.g. New Year Mega Draw"
                />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label fw-semibold">Ticket Price</label>
                <input
                  class="form-control"
                  id="addPrice"
                  type="number"
                  min="0"
                  placeholder="e.g. 50"
                />
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold"
                  >Lottery Description</label
                >
                <textarea
                  class="form-control"
                  id="addDesc"
                  rows="3"
                  placeholder="Description..."
                ></textarea>
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label fw-semibold">Start Date</label>
                <input class="form-control" id="addStart" type="date" />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label fw-semibold">Expire Date</label>
                <input class="form-control" id="addExpire" type="date" />
              </div>
            </div>

            <div class="alert alert-warning mt-3 mb-0 small">
              This is UI-only demo. Data is saved in
              <span class="mono">localStorage</span>.
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
            <button class="btn primary-grad" id="btnCreateLottery">
              <i class="bi bi-check2 me-2"></i>Create
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      $(function () {
        // active link highlight (top navbar)
        const page = (location.pathname.split("/").pop() || "").toLowerCase();
        $("#topbarNav .nav-link")
          .removeClass("active")
          .each(function () {
            const href = ($(this).attr("href") || "").toLowerCase();
            if (href === page) $(this).addClass("active");
          });

        const STORAGE_KEY = "admin_lotteries_v1";

        function seedIfEmpty() {
          const existing = localStorage.getItem(STORAGE_KEY);
          if (existing) return;

          const seed = [
            {
              id: "L-2001",
              name: "Weekly Lucky Draw",
              description:
                "Win cash prizes every week. Buy tickets and participate.",
              startDate: "2026-01-01",
              expireDate: "2026-01-31",
              ticketPrice: 50,
            },
            {
              id: "L-2002",
              name: "Mega Festival Lottery",
              description:
                "Festival special lottery with huge prizes and bonuses.",
              startDate: "2025-12-15",
              expireDate: "2026-02-15",
              ticketPrice: 100,
            },
            {
              id: "L-2003",
              name: "Monthly Gold Draw",
              description: "Monthly draw. Bigger ticket price, bigger rewards.",
              startDate: "2025-12-01",
              expireDate: "2026-01-30",
              ticketPrice: 200,
            },
          ];
          localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
        }

        function loadLotteries() {
          try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          } catch (e) {
            return [];
          }
        }

        function saveLotteries(list) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function money(n) {
          const num = Number(n);
          if (Number.isNaN(num)) return String(n);
          return "৳ " + num.toLocaleString("en-US");
        }

        function escapeHtml(s) {
          return String(s).replace(
            /[&<>"'`=\/]/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
                "/": "&#x2F;",
                "`": "&#x60;",
                "=": "&#x3D;",
              }[c])
          );
        }

        function render() {
          const lots = loadLotteries();
          $("#lotCount").text(lots.length);

          const $grid = $("#lotteryGrid").empty();
          if (!lots.length) {
            $grid.append(`
              <div class="col-12">
                <div class="soft-card p-4 text-center">
                  <div class="fw-semibold">No lotteries available</div>
                  <div class="small-muted">Click “Add New Lottery” to create one.</div>
                </div>
              </div>
            `);
            return;
          }

          lots.forEach((l) => {
            $grid.append(`
              <div class="col-12 col-md-6 col-xl-4">
                <div class="soft-card p-3 lot-card" data-id="${escapeHtml(
                  l.id
                )}">
                  <div class="d-flex align-items-start justify-content-between gap-2">
                    <div>
                      <div class="fw-bold text-dark">${escapeHtml(l.name)}</div>
                      <div class="small-muted">${escapeHtml(
                        l.description
                      )}</div>
                    </div>
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle">${escapeHtml(
                      l.id
                    )}</span>
                  </div>

                  <hr class="my-3" />

                  <div class="row g-2 small">
                    <div class="col-6">
                      <div class="text-muted">Start Date</div>
                      <div class="fw-semibold">${escapeHtml(
                        l.startDate || "—"
                      )}</div>
                    </div>
                    <div class="col-6">
                      <div class="text-muted">Expire Date</div>
                      <div class="fw-semibold">${escapeHtml(
                        l.expireDate || "—"
                      )}</div>
                    </div>
                    <div class="col-12">
                      <div class="text-muted">Ticket Price</div>
                      <div class="fw-semibold">${escapeHtml(
                        money(l.ticketPrice)
                      )}</div>
                    </div>
                  </div>

                  <div class="mt-3 text-end">
                    <span class="btn btn-soft btn-sm">
                      Edit <i class="bi bi-arrow-right ms-1"></i>
                    </span>
                  </div>
                </div>
              </div>
            `);
          });
        }

        // click card -> edit page
        $("#lotteryGrid").on("click", ".lot-card", function () {
          const id = $(this).data("id");
          window.location.href =
            "lotary-edit.html?id=" + encodeURIComponent(id);
        });

        // add modal
        const addModal = new bootstrap.Modal(
          document.getElementById("addModal")
        );

        $("#btnAddNew").on("click", function () {
          $("#addName,#addDesc,#addStart,#addExpire,#addPrice").val("");
          addModal.show();
        });

        function makeId(existingList) {
          const base = 2000 + existingList.length + 1;
          return "L-" + base;
        }

        $("#btnCreateLottery").on("click", function () {
          const name = $("#addName").val().trim();
          const desc = $("#addDesc").val().trim();
          const start = $("#addStart").val();
          const expire = $("#addExpire").val();
          const price = $("#addPrice").val();

          if (!name || !desc || !start || !expire || !price) {
            alert("Please fill all fields.");
            return;
          }

          const list = loadLotteries();
          list.unshift({
            id: makeId(list),
            name,
            description: desc,
            startDate: start,
            expireDate: expire,
            ticketPrice: Number(price),
          });

          saveLotteries(list);
          addModal.hide();
          render();
        });

        seedIfEmpty();
        render();
      });
    </script>
  </body>
</html>
