<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Tracking - Admin Panel</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        min-height: 100vh;
        font-family: "Segoe UI", sans-serif;
      }

      /* Top Navbar */
      .topbar {
        background: linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      }

      .brand-wrap h3 {
        margin: 0;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #fff;
        line-height: 1.1;
      }
      .brand-wrap p {
        margin: 0;
        font-size: 0.8rem;
        opacity: 0.8;
        color: #fff;
      }

      .navbar .nav-link {
        color: rgba(255, 255, 255, 0.85);
        padding: 10px 14px;
        border-radius: 12px;
        font-weight: 600;
        transition: all 0.25s ease;
        display: inline-flex;
        gap: 10px;
        align-items: center;
        white-space: nowrap;
      }

      .navbar .nav-link:hover,
      .navbar .nav-link.active {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      }

      .navbar .nav-link i {
        font-size: 1.15rem;
      }

      /* Main content spacing under sticky navbar */
      .main-content {
        padding: 40px 16px;
      }

      @media (min-width: 992px) {
        .main-content {
          padding: 40px;
        }
      }

      .header-title {
        font-weight: 700;
        color: #1e293b;
        letter-spacing: -0.5px;
      }

      .search-container {
        max-width: 800px;
        margin: 0 auto 50px;
      }

      .search-box {
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
        border-radius: 20px;
        overflow: hidden;
        background: white;
      }

      .search-box .form-control {
        border: none;
        padding: 20px 25px;
        font-size: 1.15rem;
      }

      .search-box .input-group-text {
        background: transparent;
        border: none;
        padding: 20px;
        color: #6366f1;
        font-size: 1.3rem;
      }

      /* User List Item */
      .user-list-item {
        background: white;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        transition: all 0.4s ease;
        border-left: 5px solid #6366f1;
      }

      .user-list-item:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 40px rgba(99, 102, 241, 0.18);
        border-left-color: #8b5cf6;
      }

      .user-avatar {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        font-size: 1.6rem;
        font-weight: bold;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
      }

      .user-info h5 {
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 4px;
      }

      .user-info p {
        color: #64748b;
        margin-bottom: 4px;
      }

      .view-btn {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border: none;
        border-radius: 12px;
        padding: 10px 24px;
        color: white;
        font-weight: 500;
        transition: all 0.3s;
      }

      .view-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      }

      .no-results {
        font-size: 1.5rem;
        color: #94a3b8;
      }

      /* Make collapsed menu look nicer on mobile */
      .navbar-collapse {
        padding: 12px 0;
      }
      @media (max-width: 991.98px) {
        .navbar .nav-link {
          width: 100%;
          justify-content: flex-start;
          padding: 12px 14px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg topbar sticky-top">
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand d-flex align-items-center gap-3" href="#">
          <div class="brand-wrap">
            <h3>Admin Panel</h3>
            <p>Management System</p>
          </div>
        </a>

        <button
          class="navbar-toggler border-0 text-white"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#topNav"
          aria-controls="topNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="bi bi-list fs-2"></i>
        </button>

        <div class="collapse navbar-collapse" id="topNav">
          <ul class="navbar-nav ms-auto gap-lg-2">
            <li class="nav-item">
              <a class="nav-link" href="#">
                <i class="bi bi-speedometer2"></i> Dashboard
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="usersTraking.html">
                <i class="bi bi-people"></i> User Tracking
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="lotary-entry.html">
                <i class="bi bi-ticket-perforated"></i> Lottery Entry
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="lotary-drow.html">
                <i class="bi bi-shuffle"></i> Lottery Draw
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="product-entry.html">
                <i class="bi bi-box-seam"></i> Product Entry
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="product-buy.html">
                <i class="bi bi-cart"></i> Product Buy
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="invest-package-entry.html">
                <i class="bi bi-wallet2"></i> Invest Package
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <h1 class="header-title mb-5 text-center">User Tracking</h1>

      <!-- Search -->
      <div class="search-container">
        <div class="input-group search-box">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input
            type="text"
            id="user-search"
            class="form-control"
            placeholder="Search by name, email, phone or father's name..."
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Users List -->
      <div id="user-list"></div>

      <div id="no-results" class="text-center py-5 d-none">
        <i class="bi bi-emoji-frown fs-1 text-muted mb-4"></i>
        <p class="no-results">No users found matching your search.</p>
      </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const users = [
        {
          id: 1,
          name: "John Doe",
          fatherName: "Richard Doe",
          email: "john@example.com",
          phone: "+1 234 567 890",
        },
        {
          id: 2,
          name: "Jane Smith",
          fatherName: "Robert Smith",
          email: "jane@example.com",
          phone: "+1 987 654 321",
        },
        {
          id: 3,
          name: "Alice Johnson",
          fatherName: "Michael Johnson",
          email: "alice@example.com",
          phone: "+1 555 123 456",
        },
        {
          id: 4,
          name: "Mohammed Ali",
          fatherName: "Ahmed Ali",
          email: "mohammed@example.com",
          phone: "+92 300 1234567",
        },
        {
          id: 5,
          name: "Sophia Williams",
          fatherName: "David Williams",
          email: "sophia@example.com",
          phone: "+44 7700 900123",
        },
        {
          id: 6,
          name: "Rahul Sharma",
          fatherName: "Rajesh Sharma",
          email: "rahul@example.com",
          phone: "+91 98765 43210",
        },
        {
          id: 7,
          name: "Emma Brown",
          fatherName: "James Brown",
          email: "emma@example.com",
          phone: "+61 400 123 456",
        },
        {
          id: 8,
          name: "Liam Garcia",
          fatherName: "Carlos Garcia",
          email: "liam@example.com",
          phone: "+34 600 123 456",
        },
        {
          id: 9,
          name: "Olivia Martinez",
          fatherName: "Jose Martinez",
          email: "olivia@example.com",
          phone: "+52 55 1234 5678",
        },
        {
          id: 10,
          name: "Noah Wilson",
          fatherName: "Thomas Wilson",
          email: "noah@example.com",
          phone: "+1 456 789 0123",
        },
      ];

      function getInitials(name) {
        return name
          .split(" ")
          .map((n) => n[0].toUpperCase())
          .join("")
          .substring(0, 2);
      }

      function renderUsers(filtered) {
        const list = $("#user-list");
        const noResults = $("#no-results");
        list.empty();

        if (filtered.length === 0) {
          noResults.removeClass("d-none");
          return;
        }
        noResults.addClass("d-none");

        filtered.forEach((user) => {
          const initials = getInitials(user.name);
          const item = `
            <div class="user-list-item d-flex align-items-center justify-content-between flex-wrap gap-3">
              <div class="d-flex align-items-center flex-grow-1">
                <div class="user-avatar me-4">${initials}</div>
                <div class="user-info">
                  <h5>${user.name}</h5>
                  <p class="mb-0"><strong>Email:</strong> ${user.email}</p>
                  <p class="mb-0"><strong>Phone:</strong> ${user.phone}</p>
                </div>
              </div>
              <a href="user-profile.html?id=${user.id}" class="btn view-btn flex-shrink-0">
                <i class="bi bi-arrow-right me-2"></i>View Profile
              </a>
            </div>`;
          list.append(item);
        });
      }

      $(document).ready(function () {
        renderUsers(users);

        $("#user-search").on("input", function () {
          const query = $(this).val().toLowerCase();
          const filtered = users.filter(
            (u) =>
              u.name.toLowerCase().includes(query) ||
              u.email.toLowerCase().includes(query) ||
              u.phone.toLowerCase().includes(query) ||
              u.fatherName.toLowerCase().includes(query)
          );
          renderUsers(filtered);
        });
      });
    </script>
  </body>
</html>
